# Minimal single-binary Tempo config: receive traces over OTLP (the
# agent uses OTLP/HTTP; gRPC is also enabled in case a future component
# prefers it) and store blocks on local disk. No Grafana anywhere in this
# stack - traces are inspected via Tempo's own HTTP API/search, see
# docs/OBSERVABILITY.md.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
